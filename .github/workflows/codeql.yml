name: codeql

on:
  pull_request:
    paths:
      - ".github/workflows/codeql.yml"
      - ".github/actions/**"
      - ".github/codeql/**"
      - ".github/workflows/**"
      - "crates/**"
      - "desktop/**"
      - "package.json"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "script/**"
      - "tools/**"
      - "turbo.json"
  push:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/codeql.yml"
      - ".github/actions/**"
      - ".github/codeql/**"
      - ".github/workflows/**"
      - "crates/**"
      - "desktop/**"
      - "package.json"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "script/**"
      - "tools/**"
      - "turbo.json"
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  javascript-typescript-actions:
    name: JavaScript, TypeScript, and Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,actions
          queries: +security-extended,security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      # Run analysis without uploading so a missing Code Security product
      # feature cannot fail a successful scan. Upload is best-effort below.
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript-actions"
          upload: never
          output: ${{ runner.temp }}/codeql-sarif-js

      - name: Upload SARIF
        id: upload-js
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif-js
          category: "/language:javascript-typescript-actions"

      - name: Note SARIF upload status
        if: steps.upload-js.outcome == 'failure'
        run: |
          echo "::warning::Code scanning SARIF upload failed (often Code Security upload unavailable). Analysis itself completed successfully."

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          queries: +security-extended,security-and-quality
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"
          upload: never
          output: ${{ runner.temp }}/codeql-sarif-rust

      - name: Upload SARIF
        id: upload-rust
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif-rust
          category: "/language:rust"

      - name: Note SARIF upload status
        if: steps.upload-rust.outcome == 'failure'
        run: |
          echo "::warning::Code scanning SARIF upload failed (often Code Security upload unavailable). Analysis itself completed successfully."
