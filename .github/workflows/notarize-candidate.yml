name: Notarize prepared macOS archive

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full frozen source commit SHA
        required: true
        type: string
      version:
        description: Prepared CLI version
        required: true
        type: string
      archive_sha256:
        description: SHA-256 of the already signed macOS archive
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: notarize-candidate-${{ inputs.candidate }}
  cancel-in-progress: false

jobs:
  notarize:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CANDIDATE: ${{ inputs.candidate }}
      VERSION: ${{ inputs.version }}
      ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
    steps:
      - name: Validate immutable candidate inputs
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false

      - name: Verify prepared signed archive
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE" ]]
          python3 - <<'PY'
          import json, os
          with open('packages/ax-code/package.json') as file:
              if json.load(file)['version'] != os.environ['VERSION']:
                  raise SystemExit('Candidate version mismatch')
          PY
          mkdir -p "$RUNNER_TEMP/notary-input" "$RUNNER_TEMP/notary-results"
          cd "$RUNNER_TEMP/notary-input"
          BASE="https://download.ax-code.com/qualification/notarization/$CANDIDATE"
          curl --fail --silent --show-error --retry 3 --max-filesize 314572800 "$BASE/ax-code-darwin-arm64.zip" -o ax-code-darwin-arm64.zip
          curl --fail --silent --show-error --retry 3 --max-filesize 4096 "$BASE/ax-code-darwin-arm64.zip.minisig" -o ax-code-darwin-arm64.zip.minisig
          printf '%s  ax-code-darwin-arm64.zip\n' "$ARCHIVE_SHA256" | shasum -a 256 -c -
          curl --fail --silent --show-error --retry 3 https://download.ax-code.com/vendor/minisign/0.12/minisign-0.12-macos.zip -o minisign.zip
          printf '%s  minisign.zip\n' 89000b19535765f9cffc65a65d64a820f433ef6db8020667f7570e06bf6aac63 | shasum -a 256 -c -
          unzip -q minisign.zip -d verifier
          VERIFIER="$(find verifier -type f -name minisign -print -quit)"
          [[ -n "$VERIFIER" ]]
          printf '%s  %s\n' d41cde458303d45c95b00473e2455a7f45f95b550931f1f0cc98ef1f61b2a8ff "$VERIFIER" | shasum -a 256 -c -
          chmod +x "$VERIFIER"
          "$VERIFIER" -V -p "$GITHUB_WORKSPACE/docs/release/ax-minisign.pub" -m ax-code-darwin-arm64.zip
          python3 "$GITHUB_WORKSPACE/script/check-release-content.py" --require-licenses ax-code-darwin-arm64.zip

      - name: Notarize existing bytes with configured Apple credentials
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          for NAME in APPLE_API_KEY_B64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [[ -n "${!NAME}" ]] || { echo "Missing configured Apple credential: $NAME"; exit 1; }
          done
          KEY_PATH="$RUNNER_TEMP/notary-api-key.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          umask 077
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$KEY_PATH"
          ARCHIVE="$RUNNER_TEMP/notary-input/ax-code-darwin-arm64.zip"
          RESULTS="$RUNNER_TEMP/notary-results"
          xcrun notarytool submit "$ARCHIVE" --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$RESULTS/mac-notarization.json"
          SUBMISSION="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RESULTS/mac-notarization.json")"
          xcrun notarytool log "$SUBMISSION" --key "$KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" "$RESULTS/mac-notarization-log.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          result = json.loads((root / 'notary-results/mac-notarization.json').read_text())
          log = json.loads((root / 'notary-results/mac-notarization-log.json').read_text())
          digest = hashlib.sha256((root / 'notary-input/ax-code-darwin-arm64.zip').read_bytes()).hexdigest()
          if result['status'] != 'Accepted' or log['status'] != 'Accepted':
              raise SystemExit('Apple notarization was not accepted')
          if log['sha256'] != digest or digest != os.environ['ARCHIVE_SHA256']:
              raise SystemExit('Notarization archive binding mismatch')
          print('Apple accepted the unchanged signed candidate archive')
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: macos-notarization-${{ inputs.candidate }}
          path: ${{ runner.temp }}/notary-results/*.json
          retention-days: 7
