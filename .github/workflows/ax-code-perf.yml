name: ax-code-perf

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Files to sample
        required: false
        type: string
        default: "25"
      repeat:
        description: Benchmark samples
        required: false
        type: string
        default: "3"
      warmup:
        description: Warmup runs
        required: false
        type: string
        default: "1"
      concurrency:
        description: Index concurrency
        required: false
        type: string
        default: "4"
      probe:
        description: Probe LSP availability before running
        required: false
        type: boolean
        default: false
      native_profile:
        description: Capture native bridge profile
        required: false
        type: boolean
        default: true
      max_elapsed_median_ms:
        description: Optional elapsed median limit
        required: false
        type: string
        default: ""
      max_total_median_ms:
        description: Optional builder total median limit
        required: false
        type: string
        default: ""
      max_phase_median_ms:
        description: Optional comma-separated phase=ms limits
        required: false
        type: string
        default: ""
      baseline:
        description: Optional baseline artifact path relative to packages/ax-code
        required: false
        type: string
        default: ""
      baseline_summary:
        description: Optional baseline summary path relative to packages/ax-code
        required: false
        type: string
        default: ""
      promote_baseline:
        description: Write the current run as the next baseline artifact
        required: false
        type: boolean
        default: false
      baseline_out:
        description: Baseline output path relative to packages/ax-code when promotion is enabled
        required: false
        type: string
        default: "../../.internal/reports/performance/perf-index-baseline.json"
      baseline_summary_out:
        description: Baseline summary path relative to packages/ax-code when promotion is enabled
        required: false
        type: string
        default: "../../.internal/reports/performance/perf-index-baseline-summary.json"
      summary_out:
        description: Machine-readable verdict path relative to packages/ax-code
        required: false
        type: string
        default: "../../.internal/reports/performance/perf-index-summary.json"
      max_elapsed_regression_pct:
        description: Optional elapsed regression limit
        required: false
        type: string
        default: ""
      max_total_regression_pct:
        description: Optional builder total regression limit
        required: false
        type: string
        default: ""
      max_phase_regression_pct:
        description: Optional comma-separated phase=pct regression limits
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    env:
      AX_CODE_DISABLE_SHARE: "true"
      PERF_LIMIT: ${{ inputs.limit }}
      PERF_REPEAT: ${{ inputs.repeat }}
      PERF_WARMUP: ${{ inputs.warmup }}
      PERF_CONCURRENCY: ${{ inputs.concurrency }}
      PERF_PROBE: ${{ inputs.probe }}
      PERF_NATIVE_PROFILE: ${{ inputs.native_profile }}
      PERF_MAX_ELAPSED_MEDIAN_MS: ${{ inputs.max_elapsed_median_ms }}
      PERF_MAX_TOTAL_MEDIAN_MS: ${{ inputs.max_total_median_ms }}
      PERF_MAX_PHASE_MEDIAN_MS: ${{ inputs.max_phase_median_ms }}
      PERF_BASELINE: ${{ inputs.baseline }}
      PERF_BASELINE_SUMMARY: ${{ inputs.baseline_summary }}
      PERF_PROMOTE_BASELINE: ${{ inputs.promote_baseline }}
      PERF_BASELINE_OUT: ${{ inputs.baseline_out }}
      PERF_BASELINE_SUMMARY_OUT: ${{ inputs.baseline_summary_out }}
      PERF_SUMMARY_OUT: ${{ inputs.summary_out }}
      PERF_MAX_ELAPSED_REGRESSION_PCT: ${{ inputs.max_elapsed_regression_pct }}
      PERF_MAX_TOTAL_REGRESSION_PCT: ${{ inputs.max_total_regression_pct }}
      PERF_MAX_PHASE_REGRESSION_PCT: ${{ inputs.max_phase_regression_pct }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ax-code JS toolchain
        uses: ./.github/actions/setup-ax-code-toolchain
        with:
          checkout: "false"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Validate and resolve workflow_dispatch inputs
        id: paths
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          require_positive_int() {
            local name="$1"
            local value="$2"
            if ! [[ "$value" =~ ^[1-9][0-9]*$ ]]; then
              echo "FAIL: ${name} must be a positive integer, got '${value}'"
              exit 1
            fi
          }

          require_non_negative_int() {
            local name="$1"
            local value="$2"
            if ! [[ "$value" =~ ^[0-9]+$ ]]; then
              echo "FAIL: ${name} must be a non-negative integer, got '${value}'"
              exit 1
            fi
          }

          resolve_repo_json() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              printf '%s=\n' "$name" >> "$GITHUB_OUTPUT"
              return
            fi
            if [[ "$value" = /* ]]; then
              echo "FAIL: ${name} must be relative to packages/ax-code, got '${value}'"
              exit 1
            fi

            local absolute
            absolute="$(realpath -m -- "$GITHUB_WORKSPACE/packages/ax-code/$value")"
            case "$absolute" in
              "$GITHUB_WORKSPACE"/*) ;;
              *)
                echo "FAIL: ${name} must stay inside the repository, got '${value}'"
                exit 1
                ;;
            esac
            if [[ "$absolute" != *.json ]]; then
              echo "FAIL: ${name} must resolve to a JSON file, got '${value}'"
              exit 1
            fi
            printf '%s=%s\n' "$name" "${absolute#"$GITHUB_WORKSPACE"/}" >> "$GITHUB_OUTPUT"
          }

          require_positive_int "limit" "$PERF_LIMIT"
          require_positive_int "repeat" "$PERF_REPEAT"
          require_non_negative_int "warmup" "$PERF_WARMUP"
          require_positive_int "concurrency" "$PERF_CONCURRENCY"

          case "$PERF_PROBE" in
            true|false) ;;
            *)
              echo "FAIL: probe must be true or false"
              exit 1
              ;;
          esac

          case "$PERF_NATIVE_PROFILE" in
            true|false) ;;
            *)
              echo "FAIL: native_profile must be true or false"
              exit 1
              ;;
          esac

          for value in "$PERF_MAX_ELAPSED_MEDIAN_MS" "$PERF_MAX_TOTAL_MEDIAN_MS" "$PERF_MAX_ELAPSED_REGRESSION_PCT" "$PERF_MAX_TOTAL_REGRESSION_PCT"; do
            if [ -n "$value" ] && ! [[ "$value" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              echo "FAIL: numeric input expected, got '$value'"
              exit 1
            fi
          done

          for value in "$PERF_BASELINE" "$PERF_BASELINE_SUMMARY" "$PERF_BASELINE_OUT" "$PERF_BASELINE_SUMMARY_OUT" "$PERF_SUMMARY_OUT"; do
            if [ -n "$value" ] && [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "FAIL: path input must not include line breaks"
              exit 1
            fi
          done

          if [ -z "$PERF_SUMMARY_OUT" ]; then
            echo "FAIL: summary_out must not be empty"
            exit 1
          fi
          if [ "$PERF_PROMOTE_BASELINE" = "true" ] && { [ -z "$PERF_BASELINE_OUT" ] || [ -z "$PERF_BASELINE_SUMMARY_OUT" ]; }; then
            echo "FAIL: promoted baseline output paths must not be empty"
            exit 1
          fi

          resolve_repo_json baseline "$PERF_BASELINE"
          resolve_repo_json baseline_summary "$PERF_BASELINE_SUMMARY"
          resolve_repo_json baseline_out "$PERF_BASELINE_OUT"
          resolve_repo_json baseline_summary_out "$PERF_BASELINE_SUMMARY_OUT"
          resolve_repo_json summary_out "$PERF_SUMMARY_OUT"

      - name: Run perf benchmark
        shell: bash
        env:
          PERF_BASELINE_PATH: ${{ steps.paths.outputs.baseline }}
          PERF_BASELINE_SUMMARY_PATH: ${{ steps.paths.outputs.baseline_summary }}
          PERF_BASELINE_OUT_PATH: ${{ steps.paths.outputs.baseline_out }}
          PERF_BASELINE_SUMMARY_OUT_PATH: ${{ steps.paths.outputs.baseline_summary_out }}
          PERF_SUMMARY_OUT_PATH: ${{ steps.paths.outputs.summary_out }}
        run: |
          set -euo pipefail

          cmd=(
            pnpm
            --dir
            packages/ax-code
            run
            perf:index
            --config
            perf-index.jsonc
            --limit
            "$PERF_LIMIT"
            --repeat
            "$PERF_REPEAT"
            --warmup
            "$PERF_WARMUP"
            --concurrency
            "$PERF_CONCURRENCY"
            --summary-out
            "$GITHUB_WORKSPACE/$PERF_SUMMARY_OUT_PATH"
            "--probe=$PERF_PROBE"
            "--native-profile=$PERF_NATIVE_PROFILE"
          )

          if [ -n "$PERF_MAX_ELAPSED_MEDIAN_MS" ]; then
            cmd+=(--max-elapsed-median-ms "$PERF_MAX_ELAPSED_MEDIAN_MS")
          fi
          if [ -n "$PERF_MAX_TOTAL_MEDIAN_MS" ]; then
            cmd+=(--max-total-median-ms "$PERF_MAX_TOTAL_MEDIAN_MS")
          fi
          if [ -n "$PERF_MAX_PHASE_MEDIAN_MS" ]; then
            while IFS= read -r item; do
              [ -z "$item" ] && continue
              cmd+=(--max-phase-median-ms "$item")
            done < <(printf '%s' "$PERF_MAX_PHASE_MEDIAN_MS" | tr ',' '\n')
          fi
          if [ -n "$PERF_BASELINE" ]; then
            cmd+=(--baseline "$GITHUB_WORKSPACE/$PERF_BASELINE_PATH")
          fi
          if [ -n "$PERF_BASELINE_SUMMARY" ]; then
            cmd+=(--baseline-summary "$GITHUB_WORKSPACE/$PERF_BASELINE_SUMMARY_PATH")
          fi
          if [ "$PERF_PROMOTE_BASELINE" = "true" ]; then
            cmd+=(--write-baseline "$GITHUB_WORKSPACE/$PERF_BASELINE_OUT_PATH")
            cmd+=(--write-baseline-summary "$GITHUB_WORKSPACE/$PERF_BASELINE_SUMMARY_OUT_PATH")
          fi
          if [ -n "$PERF_MAX_ELAPSED_REGRESSION_PCT" ]; then
            cmd+=(--max-elapsed-regression-pct "$PERF_MAX_ELAPSED_REGRESSION_PCT")
          fi
          if [ -n "$PERF_MAX_TOTAL_REGRESSION_PCT" ]; then
            cmd+=(--max-total-regression-pct "$PERF_MAX_TOTAL_REGRESSION_PCT")
          fi
          if [ -n "$PERF_MAX_PHASE_REGRESSION_PCT" ]; then
            while IFS= read -r item; do
              [ -z "$item" ] && continue
              cmd+=(--max-phase-regression-pct "$item")
            done < <(printf '%s' "$PERF_MAX_PHASE_REGRESSION_PCT" | tr ',' '\n')
          fi

          "${cmd[@]}"

      - name: Render perf markdown report
        env:
          PERF_SUMMARY_OUT_PATH: ${{ steps.paths.outputs.summary_out }}
        run: |
          pnpm --dir packages/ax-code run perf:report \
            --summary "$GITHUB_WORKSPACE/$PERF_SUMMARY_OUT_PATH" \
            --out "../../.internal/reports/performance/perf-index-report.md"

      - name: Upload perf artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ax-code-perf-report
          path: .internal/reports/performance/perf-index.json
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload perf summary
        if: always() && steps.paths.outputs.summary_out != ''
        uses: actions/upload-artifact@v7
        with:
          name: ax-code-perf-summary
          path: ${{ steps.paths.outputs.summary_out }}
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload perf markdown report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ax-code-perf-markdown
          path: .internal/reports/performance/perf-index-report.md
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload promoted baseline
        if: always() && inputs.promote_baseline && steps.paths.outputs.baseline_out != ''
        uses: actions/upload-artifact@v7
        with:
          name: ax-code-perf-baseline
          path: ${{ steps.paths.outputs.baseline_out }}
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Upload promoted baseline summary
        if: always() && inputs.promote_baseline && steps.paths.outputs.baseline_summary_out != ''
        uses: actions/upload-artifact@v7
        with:
          name: ax-code-perf-baseline-summary
          path: ${{ steps.paths.outputs.baseline_summary_out }}
          if-no-files-found: ignore
          include-hidden-files: true
