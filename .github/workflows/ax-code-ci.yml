name: ax-code

on:
  pull_request:
    paths:
      - ".github/workflows/ax-code-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "packages/ax-code/**"
      - "packages/ax-code-intel/**"
      - "packages/ax-code-reason/**"
      - "crates/**"
      - "packages/sdk/**"
      - "packages/util/**"
      - "packages/plugin/**"
      - "packages/script/**"
      - "script/**"
  push:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/ax-code-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "packages/ax-code/**"
      - "packages/ax-code-intel/**"
      - "packages/ax-code-reason/**"
      - "crates/**"
      - "packages/sdk/**"
      - "packages/util/**"
      - "packages/plugin/**"
      - "packages/script/**"
      - "script/**"
  workflow_dispatch:
    inputs:
      live:
        description: Run live ax-code tests
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    env:
      AX_CODE_DISABLE_SHARE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Validate workflow_dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          case "${{ inputs.live }}" in
            true|false) ;;
            *)
              echo "FAIL: live must be true or false"
              exit 1
              ;;
          esac

      - name: Setup Ax-code JS toolchain
        uses: ./.github/actions/setup-ax-code-toolchain
        with:
          checkout: "false"
          node-version: "24"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Security scan
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --format=table

      - name: Build SDK
        run: pnpm --dir packages/sdk/js run build

      - name: Verify generated SDK artifacts are current
        shell: bash
        run: |
          drift="$(git status --porcelain=v1 --untracked-files=all -- \
            packages/sdk/openapi.json \
            packages/sdk/js/src/gen \
            packages/sdk/js/src/v2/gen)"
          if [ -n "$drift" ]; then
            echo "Generated SDK artifacts are stale. Run: pnpm --dir packages/sdk/js run build"
            printf '%s\n' "$drift"
            exit 1
          fi

      - name: Test SDK
        run: pnpm --dir packages/sdk/js test

      - name: Test repository scripts
        run: pnpm run test:scripts

      - name: Test extracted core packages
        run: pnpm run test:extracted-packages

      - name: Build Plugin
        run: pnpm --dir packages/plugin run build

      - name: Typecheck ax-code
        run: pnpm --dir packages/ax-code run typecheck

      - name: Run deterministic ax-code tests
        shell: bash
        env:
          AX_CODE_DISABLE_AUTOUPDATE: "1"
          AX_CODE_DISABLE_LSP_DOWNLOAD: "1"
          AX_CODE_DISABLE_MODELS_FETCH: "1"
        run: |
          set -euo pipefail

          # PRs keep the default Vitest worker cap and a single process so
          # feedback stays close to local `test:ci -- deterministic`.
          # Post-merge pushes still shard (heap), but no longer pay for V8
          # coverage in this required job. Coverage remains a local
          # `test:ci` coverage run or a follow-up workflow.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            export NODE_OPTIONS="--max-old-space-size=6144"
            export AX_TEST_MAX_WORKERS="2"
            export AX_TEST_SHARD_SIZE="25"
          fi

          pnpm --dir packages/ax-code run test:ci -- deterministic

      - name: Summarize ax-code risk map
        if: always()
        run: pnpm --dir packages/ax-code run test:risk

      - name: Upload deterministic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ax-code-deterministic-report
          path: |
            .internal/reports/testing/junit/*.xml
            .internal/reports/testing/test-risk.md
          if-no-files-found: ignore

  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AX_TEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ax-code JS toolchain
        uses: ./.github/actions/setup-ax-code-toolchain
        with:
          checkout: "false"
          node-version: "24"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Compile SDK
        run: pnpm --dir packages/sdk/js exec tsc
      - name: Run runtime contract tests without retries
        run: pnpm --dir packages/ax-code run test:ci -- runtime-contract --rerun-on-fail 0 --dir ../../.internal/reports/testing/runtime-contract
      - name: Upload runtime contract reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ax-code-runtime-contract-report
          path: .internal/reports/testing/runtime-contract/*.xml
          if-no-files-found: error

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    env:
      AX_CODE_DISABLE_SHARE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ax-code JS toolchain
        uses: ./.github/actions/setup-ax-code-toolchain
        with:
          checkout: "false"
          node-version: "24"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm exec tsc
        working-directory: packages/sdk/js

      - name: Build Plugin
        run: pnpm --dir packages/plugin run build

      - name: Run live ax-code tests
        run: pnpm --dir packages/ax-code run test:ci -- live

      - name: Upload live reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ax-code-live-report
          path: .internal/reports/testing/junit/*.xml
          if-no-files-found: ignore

  # Disabled during the ADR-074 interim state: the TUI framework is consumed
  # via a local pnpm link to the sibling ax-tui checkout, which GitHub Actions
  # cannot resolve. Re-enable once packages/ax-code pins
  # jsr:@defai-digital/ax-tui (see .internal/adr/ADR-074 and
  # .internal/prd/PRD-2026-09-05-ax-tui-extraction.md).
  tui-node26-smoke:
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      AX_CODE_DISABLE_SHARE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ax-code JS toolchain
        uses: ./.github/actions/setup-ax-code-toolchain
        with:
          checkout: "false"
          node-version: "26"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --dir packages/sdk/js run build

      - name: Install source launcher
        run: AX_CODE_BIN_DIR="$GITHUB_WORKSPACE/.tmp/tui-smoke-bin" pnpm run setup:cli -- --source

      - name: TUI startup smoke
        run: pnpm --dir packages/ax-code run tui:startup-smoke -- --bin "$GITHUB_WORKSPACE/.tmp/tui-smoke-bin/ax-code"
