name: ax-code

on:
  pull_request:
    paths:
      - ".github/workflows/ax-code-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "packages/ax-code/**"
      - "packages/ax-code-intel/**"
      - "packages/ax-code-reason/**"
      - "crates/**"
      - "packages/sdk/**"
      - "packages/util/**"
      - "packages/plugin/**"
      - "packages/script/**"
      - "script/**"
  push:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/ax-code-ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "packages/ax-code/**"
      - "packages/ax-code-intel/**"
      - "packages/ax-code-reason/**"
      - "crates/**"
      - "packages/sdk/**"
      - "packages/util/**"
      - "packages/plugin/**"
      - "packages/script/**"
      - "script/**"
  workflow_dispatch:
    inputs:
      live:
        description: Run live ax-code tests
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  windows-snapshot:
    name: Windows runtime and recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ax-code JS toolchain
        uses: ./.github/actions/setup-ax-code-toolchain
        with:
          checkout: "false"
          node-version: "26"
      # Install deterministically, then qualify PTY on each native architecture.
      - name: Install deps
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build Windows PTY native addons
        run: pnpm --dir packages/ax-code rebuild node-pty-prebuilt-multiarch
      - name: Verify Windows PTY build configuration
        run: node .github/scripts/assert-windows-pty-build.cjs
      - name: Test native PTY input, output, resize, and exit
        timeout-minutes: 1
        run: node script/verify-pty.cjs packages/ax-code/node_modules/node-pty-prebuilt-multiarch
      - name: Build SDK runtime exports
        working-directory: packages/sdk/js
        run: pnpm exec tsc
      - name: Test native console, process framing, and Git recovery
        working-directory: packages/ax-code
        env:
          AX_TEST_FILES: test/cli/bootstrap/windows-console.test.ts,test/cli/tui/process-wire.test.ts,test/snapshot/windows-paths.test.ts,test/snapshot/literal-revert.test.ts,test/session/redo-files.test.ts,test/worktree/remove-recovery.test.ts,test/script/source-launcher.test.ts
        run: pnpm exec vitest run --retry=0

  checks:
    name: SDK, typecheck, and scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AX_CODE_DISABLE_SHARE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Validate workflow_dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          case "${{ inputs.live }}" in
            true|false) ;;
            *)
              echo "FAIL: live must be true or false"
              exit 1
              ;;
          esac

      - name: Setup Ax-code JS toolchain
        uses: ./.github/actions/setup-ax-code-toolchain
        with:
          checkout: "false"
          node-version: "24"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Security scan
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --format=table

      - name: Build SDK
        run: pnpm --dir packages/sdk/js run build

      - name: Verify generated SDK artifacts are current
        shell: bash
        run: |
          drift="$(git status --porcelain=v1 --untracked-files=all -- \
            packages/sdk/openapi.json \
            packages/sdk/js/src/gen \
            packages/sdk/js/src/v2/gen)"
          if [ -n "$drift" ]; then
            echo "Generated SDK artifacts are stale. Run: pnpm --dir packages/sdk/js run build"
            printf '%s\n' "$drift"
            exit 1
          fi

      - name: Test SDK
        run: pnpm --dir packages/sdk/js test

      - name: Test extracted core packages
        run: pnpm run test:extracted-packages

      - name: Build Plugin
        run: pnpm --dir packages/plugin run build

      - name: Typecheck ax-code
        run: pnpm --dir packages/ax-code run typecheck

  deterministic:
    name: deterministic (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      AX_CODE_DISABLE_SHARE: "true"
      AX_TEST_SHARD_INDEX: ${{ matrix.shard }}
      AX_TEST_SHARD_COUNT: "4"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ax-code JS toolchain
        uses: ./.github/actions/setup-ax-code-toolchain
        with:
          checkout: "false"
          node-version: "24"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Compile SDK
        run: pnpm --dir packages/sdk/js exec tsc

      - name: Build Plugin
        run: pnpm --dir packages/plugin run build

      - name: Run deterministic ax-code tests
        shell: bash
        env:
          AX_CODE_DISABLE_AUTOUPDATE: "1"
          AX_CODE_DISABLE_LSP_DOWNLOAD: "1"
          AX_CODE_DISABLE_MODELS_FETCH: "1"
        run: |
          set -euo pipefail

          # Four GitHub runners split the suite with round-robin
          # AX_TEST_SHARD_INDEX. Keep each runner as a single Vitest process;
          # coverage remains a local AX_TEST_COVERAGE=1 run.
          pnpm --dir packages/ax-code run test:ci -- deterministic --rerun-on-fail 0

      - name: Summarize ax-code risk map
        if: always()
        run: pnpm --dir packages/ax-code run test:risk

      - name: Upload deterministic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ax-code-deterministic-report-${{ matrix.shard }}
          path: |
            .internal/reports/testing/junit/*.xml
            .internal/reports/testing/test-risk.md
          if-no-files-found: ignore

  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AX_TEST_MAX_WORKERS: "2"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ax-code JS toolchain
        uses: ./.github/actions/setup-ax-code-toolchain
        with:
          checkout: "false"
          node-version: "24"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Compile SDK
        run: pnpm --dir packages/sdk/js exec tsc
      - name: Run runtime contract tests without retries
        run: pnpm --dir packages/ax-code run test:ci -- runtime-contract --rerun-on-fail 0 --dir ../../.internal/reports/testing/runtime-contract
      - name: Upload runtime contract reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ax-code-runtime-contract-report
          path: .internal/reports/testing/runtime-contract/*.xml
          if-no-files-found: error

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    env:
      AX_CODE_DISABLE_SHARE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ax-code JS toolchain
        uses: ./.github/actions/setup-ax-code-toolchain
        with:
          checkout: "false"
          node-version: "24"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm exec tsc
        working-directory: packages/sdk/js

      - name: Build Plugin
        run: pnpm --dir packages/plugin run build

      - name: Run live ax-code tests
        run: pnpm --dir packages/ax-code run test:ci -- live

      - name: Upload live reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ax-code-live-report
          path: .internal/reports/testing/junit/*.xml
          if-no-files-found: ignore

  # Exercise the pinned JSR framework from a clean checkout with no sibling.
  # Native delivery and its integrity checks belong to the installed package.
  tui-node26-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AX_CODE_DISABLE_SHARE: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ax-code JS toolchain
        uses: ./.github/actions/setup-ax-code-toolchain
        with:
          checkout: "false"
          node-version: "26"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --dir packages/sdk/js run build

      - name: Install source launcher
        run: AX_CODE_BIN_DIR="$GITHUB_WORKSPACE/.tmp/tui-smoke-bin" pnpm run setup:cli -- --source

      - name: Test Node 26 launcher admission and literal paths
        working-directory: packages/ax-code
        env:
          AX_TEST_FILES: test/script/node-launcher.test.ts,test/script/source-launcher.test.ts
        run: pnpm exec vitest run --retry=0

      - name: TUI startup smoke
        run: pnpm --dir packages/ax-code run tui:startup-smoke -- --bin "$GITHUB_WORKSPACE/.tmp/tui-smoke-bin/ax-code"
