name: models-drift

on:
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch:

concurrency:
  group: models-drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Propose models snapshot updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Setup Ax-code JS toolchain
        uses: ./.github/actions/setup-ax-code-toolchain
        with:
          checkout: "false"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fetch once. The feed can change between generation and a second live
      # comparison, so validate the generated candidate with offline tests.
      - name: Generate snapshot update
        run: pnpm --dir packages/ax-code exec tsx script/update-models.ts

      - name: Validate generated snapshot
        run: |
          pnpm --dir packages/sdk/js exec tsc
          pnpm --dir packages/ax-code run typecheck
          AX_TEST_FILES=test/script/models-snapshot.test.ts,test/script/update-models.test.ts,test/provider/model-support.test.ts,test/provider/models.test.ts,test/cli/models-json.test.ts pnpm --dir packages/ax-code exec vitest run --retry 0
          pnpm run check:no-cost

      - name: Save reviewable snapshot patch
        run: |
          mkdir -p "$RUNNER_TEMP/models-update"
          git diff --binary -- packages/ax-code/src/provider/models-snapshot.json > "$RUNNER_TEMP/models-update/models-snapshot.patch"
          git diff --stat -- packages/ax-code/src/provider/models-snapshot.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload snapshot patch
        uses: actions/upload-artifact@v7
        with:
          name: models-snapshot-update
          path: ${{ runner.temp }}/models-update/models-snapshot.patch
          retention-days: 14

      # Mint write access only after validation. Keep the job's GITHUB_TOKEN
      # read-only and scope the App installation token to this repository.
      - name: Create snapshot App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AX_CODE_MODELS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AX_CODE_MODELS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ax-code
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update snapshot pull request
        id: proposal
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/models-snapshot
          base: main
          add-paths: packages/ax-code/src/provider/models-snapshot.json
          commit-message: "chore(models): refresh upstream model snapshot"
          title: "chore(models): refresh upstream model snapshot"
          body: |
            Refresh the snapshot from a single models.dev response using the repository generator.

            Upstream data changes are routine maintenance. Download, generation, typecheck, model-contract, and no-cost failures still fail the workflow. Local provider normalization and model filtering remain enforced by the generator and tests.

            The App-authenticated pull request triggers the normal core and repository CI checks. Review the catalog diff before merging; no automatic merge is configured.

      - name: Summarize snapshot proposal
        if: steps.proposal.outputs.pull-request-url != ''
        env:
          PR_URL: ${{ steps.proposal.outputs.pull-request-url }}
        run: |
          printf 'Snapshot update awaits review: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
