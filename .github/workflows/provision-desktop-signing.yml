name: Provision Desktop Signing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provision-desktop-signing
  cancel-in-progress: false

jobs:
  seal:
    if: github.repository == 'defai-digital/ax-code' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install sealed-box implementation
        run: sudo apt-get update && sudo apt-get install -y python3-nacl

      - name: Seal credentials for the fixed Desktop repository key
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYTHON'
          import base64
          import json
          import os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox

          names = (
              "APPLE_API_ISSUER",
              "APPLE_API_KEY_B64",
              "APPLE_API_KEY_ID",
              "APPLE_CERTIFICATE",
              "APPLE_CERTIFICATE_PASSWORD",
              "APPLE_TEAM_ID",
              "AZURE_CLIENT_ID",
              "AZURE_CLIENT_SECRET",
              "AZURE_TENANT_ID",
          )
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit("Required source credentials unavailable: " + ", ".join(missing))
          box = SealedBox(PublicKey(base64.b64decode("/CoFCKxufhSdu+PbUDvPFcee40h8JlIZJXqed+L5/g8=", validate=True)))
          payload = {
              "repository": "defai-digital/ax-code-desktop",
              "key_id": "3380204578043523366",
              "secrets": {
                  name: base64.b64encode(box.encrypt(os.environ[name].encode())).decode()
                  for name in names
              },
          }
          Path("sealed-desktop-signing.json").write_text(json.dumps(payload) + "\n")
          print("Sealed all nine credentials for the fixed Desktop repository key")
          PYTHON

      - name: Retain destination-encrypted handoff
        uses: actions/upload-artifact@v7
        with:
          name: sealed-desktop-signing
          path: sealed-desktop-signing.json
          if-no-files-found: error
          retention-days: 1
