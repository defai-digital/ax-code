name: ax-tui

on:
  pull_request:
    paths:
      - ".github/workflows/ax-tui.yml"
      - "packages/ax-tui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/ax-tui.yml"
      - "packages/ax-tui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

concurrency:
  group: ax-tui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: AX TUI quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ax-code JS toolchain
        uses: ./.github/actions/setup-ax-code-toolchain
        with:
          checkout: "false"

      - name: Install deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Framework terminal checks use node-pty, not the application's patched
      # node-pty-prebuilt-multiarch (which has its own compiler qualification).
      - name: Prepare framework PTY
        run: pnpm --dir packages/ax-tui rebuild node-pty

      - name: Require native FFI support for runtime regressions
        run: node --experimental-ffi -e "require('node:ffi')"

      - name: Typecheck
        run: pnpm --dir packages/ax-tui run typecheck

      - name: Check package contracts
        run: pnpm --dir packages/ax-tui run check

      - name: Test
        run: pnpm --dir packages/ax-tui test

      - name: Validate terminal behavior through tmux
        if: runner.os == 'Linux'
        working-directory: packages/ax-tui
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          node script/terminal-quality.ts --tmux

      - name: Run application soak
        working-directory: packages/ax-tui
        run: node --experimental-ffi --expose-gc script/stress-application.ts 1000

      - name: Test and build the Rust width kernel
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ax-tui-rust-width
        run: |
          rustup target add wasm32-unknown-unknown
          manifest=packages/ax-tui/experiments/text-width/rust/Cargo.toml
          cargo test --locked --manifest-path "$manifest"
          cargo build --release --locked --manifest-path "$manifest"
          cargo build --release --locked --manifest-path "$manifest" --target wasm32-unknown-unknown

      - name: Load the Rust width library on clean Alpine
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source_dir="$GITHUB_WORKSPACE/packages/ax-tui/experiments/text-width/rust"
          output_dir="$(mktemp -d)"
          trap 'rm -rf "$output_dir"' EXIT
          docker run --rm -v "$source_dir:/src:ro" -v "$output_dir:/out" \
            -e CARGO_TARGET_DIR=/tmp/target -e 'RUSTFLAGS=-C target-feature=-crt-static' \
            rust:1.98-alpine sh -ec '
              cargo build --locked --release --manifest-path /src/Cargo.toml
              cc -Wall -Wextra -Werror /src/native-smoke.c -ldl -o /out/width-smoke
              cp /tmp/target/release/libax_tui_text_width.so /out/'
          docker run --rm -v "$output_dir:/out:ro" alpine:3.22 \
            /out/width-smoke /out/libax_tui_text_width.so

      - name: Install pinned Zig
        shell: bash
        run: pnpm --dir packages/ax-tui exec tsx script/ci-install-zig.ts

      - name: Run native tests
        shell: bash
        run: pnpm --dir packages/ax-tui run test:native

      - name: Build native and WASM width experiment
        shell: bash
        run: pnpm --dir packages/ax-tui run build:wasm-experiment

      - name: Qualify Zig and Rust width parity on native and WASM
        shell: bash
        env:
          AX_CODE_TUI_REQUIRE_TEXT_WIDTH_EXPERIMENT: "1"
          AX_CODE_TUI_RUST_WIDTH_DIR: ${{ runner.temp }}/ax-tui-rust-width
        run: |
          pnpm --dir packages/ax-tui exec tsx script/generate-rust-width-data.ts --check
          pnpm --dir packages/ax-tui exec vitest run test/text-width-experiment.test.ts

      - name: Verify publication payload
        if: runner.os == 'Linux'
        run: pnpm --dir packages/ax-tui run check:package
