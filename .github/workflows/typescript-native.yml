name: TypeScript native qualification

# Routine checks cover native LSP integration, compiler delivery, and packaging.
# Other application changes remain covered by ax-code CI and the weekly matrix.
on:
  workflow_dispatch:
  schedule:
    # Push and pull_request skip both Windows runners. This weekly run qualifies them.
    - cron: "47 6 * * 1"
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/typescript-native.yml"
      - "script/verify-typescript-native.cjs"
      - "script/verify-typescript-native.test.ts"
      - "packages/ax-code-intel/src/**"
      - "packages/ax-code-intel/test/**"
      - "packages/ax-code/script/**"
      - "packages/ax-code/src/lsp-glue.ts"
      - "packages/ax-code/src/code-intelligence/**"
      - "packages/ax-code/src/project/**"
      - "packages/ax-code/src/config/**"
      - "packages/ax-code/src/bun/**"
      - "packages/ax-code/src/bun.ts"
      - "packages/ax-code/src/cli/boot*.ts"
      - "packages/ax-code/src/cli/cmd/debug/**"
      - "packages/ax-code/src/index*.ts"
      - "packages/ax-code/test/lsp/**"
      - "packages/ax-code/test/fixture/lsp/**"
      - "packages/util/**"
      - "packages/plugin/**"
      - "packages/*/package.json"
      - "packages/*/tsconfig*.json"
      - "packages/sdk/js/package.json"
      - "packages/sdk/js/tsconfig*.json"
      - "package.json"
      - "tsconfig*.json"
      - "script/node-ffi-runner.mjs"
      - "script/solid-loader.mjs"
      - ".github/actions/setup-ax-code-toolchain/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/typescript-native.yml"
      - "script/verify-typescript-native.cjs"
      - "script/verify-typescript-native.test.ts"
      - "packages/ax-code-intel/src/**"
      - "packages/ax-code-intel/test/**"
      - "packages/ax-code/script/**"
      - "packages/ax-code/src/lsp-glue.ts"
      - "packages/ax-code/src/code-intelligence/**"
      - "packages/ax-code/src/project/**"
      - "packages/ax-code/src/config/**"
      - "packages/ax-code/src/bun/**"
      - "packages/ax-code/src/bun.ts"
      - "packages/ax-code/src/cli/boot*.ts"
      - "packages/ax-code/src/cli/cmd/debug/**"
      - "packages/ax-code/src/index*.ts"
      - "packages/ax-code/test/lsp/**"
      - "packages/ax-code/test/fixture/lsp/**"
      - "packages/util/**"
      - "packages/plugin/**"
      - "packages/*/package.json"
      - "packages/*/tsconfig*.json"
      - "packages/sdk/js/package.json"
      - "packages/sdk/js/tsconfig*.json"
      - "package.json"
      - "tsconfig*.json"
      - "script/node-ffi-runner.mjs"
      - "script/solid-loader.mjs"
      - ".github/actions/setup-ax-code-toolchain/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: typescript-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Job-level if cannot read matrix. Build the include list here so push and
  # pull_request never request a Windows runner. windows-2022 spent about four
  # minutes on the candidate distribution and competed with ax-code CI.
  native-matrix:
    name: TypeScript native matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          include='[{"os":"macos-latest","distribution":"ax-code-darwin-arm64"},{"os":"ubuntu-24.04","distribution":"ax-code-linux-x64"},{"os":"ubuntu-24.04-arm","distribution":"ax-code-linux-arm64"}]'
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            include='[{"os":"macos-latest","distribution":"ax-code-darwin-arm64"},{"os":"ubuntu-24.04","distribution":"ax-code-linux-x64"},{"os":"ubuntu-24.04-arm","distribution":"ax-code-linux-arm64"},{"os":"windows-2022","distribution":"ax-code-windows-x64"},{"os":"windows-11-arm","distribution":"ax-code-windows-arm64"}]'
          fi
          echo "include=${include}" >> "$GITHUB_OUTPUT"

  native:
    name: TypeScript 7 (${{ matrix.os }})
    needs: native-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.native-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ax-code-toolchain
        with:
          checkout: "false"
          node-version: "26"
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test native diagnostics and lifecycle
        working-directory: packages/ax-code-intel
        run: pnpm exec vitest run test/typescript-native.test.ts test/native-client-contract.test.ts test/memory.test.ts test/memory-lifecycle.test.ts --retry=0 --testTimeout=60000
      - name: Test qualification process cleanup
        run: pnpm exec vitest run script/verify-typescript-native.test.ts --retry=0
      - name: Compile SDK
        run: pnpm --dir packages/sdk/js exec tsc
      - name: Build Plugin
        run: pnpm --dir packages/plugin run build
      - name: Build candidate distribution
        run: pnpm --dir packages/ax-code exec tsx script/build-node-tui.ts
      - name: Verify relocated native TypeScript runtime
        run: node script/verify-typescript-native.cjs packages/ax-code/dist/${{ matrix.distribution }}
