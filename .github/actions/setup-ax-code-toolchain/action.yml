name: Setup Ax-code JS toolchain
description: Shared Node.js + pnpm toolchain bootstrap for workflows

inputs:
  node-version:
    # 26 provides node:ffi (--experimental-ffi), required by the AX Code TUI Node
    # backend that the node-bundled build/smoke exercises.
    description: Node.js version
    required: false
    default: "26"
  pnpm-version:
    description: pnpm version
    required: false
    default: "10.33.4"
  cache:
    description: pnpm cache strategy; set empty to disable caching
    required: false
    default: pnpm
  checkout:
    description: Whether to run actions/checkout
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Checkout
      if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@v7

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: https://npm.pkg.github.com
        scope: "@defai-digital"
        cache: ${{ inputs.cache }}
        cache-dependency-path: pnpm-lock.yaml

    - name: Configure read-only GitHub Packages authentication
      shell: bash
      env:
        PACKAGE_READ_TOKEN: ${{ github.token }}
      run: |
        umask 077
        config="$RUNNER_TEMP/ax-code-packages.npmrc"
        printf '//npm.pkg.github.com/:_authToken=%s\n' "$PACKAGE_READ_TOKEN" > "$config"
        printf 'NPM_CONFIG_USERCONFIG=%s\n' "$config" >> "$GITHUB_ENV"
