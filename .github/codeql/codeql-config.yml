name: ax-code-codeql

paths-ignore:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/test/**"
  - "**/tests/**"
  # Extracted / generated TUI framework bundles. Framework maintenance lives in
  # the sibling ax-tui repo; leftover hashed bundles are not source of truth.
  - "packages/ax-code-tui/**"
  - "**/*.min.js"
  - "script/vendor-tui-native.ts"
  # Maintainer scripts persist fetched catalogs/snapshots by design.
  - "packages/ax-code/script/fs-compat.ts"
  - "packages/ax-code/script/update-models.ts"

query-filters:
  # napi-rs `#[napi] pub struct` FFI wrappers trip this query with no
  # corresponding unsafe pointer arithmetic in our source.
  - exclude:
      id: rust/access-invalid-pointer
  # Process.spawn is argv-only (`shell` is boolean false unless explicitly
  # true). These queries still fire because callers pass HOME/PATH-derived
  # absolute binaries into that wrapper.
  - exclude:
      id: js/shell-command-injection-from-environment
  - exclude:
      id: js/indirect-command-line-injection
