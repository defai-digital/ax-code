appId: ai.defai.ax-code-app
productName: AX Code
copyright: Copyright © 2025-2026 DEFAI Private Limited

# We rebuild native modules manually via rebuild:native before packaging.
npmRebuild: false

directories:
  buildResources: build
  output: dist

# Include ${os} so mac arm64 zip and win arm64 zip don't collide on the same
# release (both would be AX-Code-1.3.0-arm64.zip without the os token).
artifactName: AX-Code-${version}-${os}-${arch}.${ext}

# Files packaged into app.asar
files:
  - package.json
  - dist/main.js
  - dist/preload.js
  # Forked by main.js via utilityProcess; must be packaged or the server cannot
  # start in a production build.
  - dist/server-process.js
  - dist/server.js
  - dist/desktop-cli.mjs

# Web assets sit outside the asar so the Express server can serve them as
# plain files at runtime (asar cannot exec native code and express.static
# does not support asar paths).
extraResources:
  - from: resources/web-dist
    to: web-dist
  # macOS menu-bar tray icons (template PNGs + status glyphs)
  - from: resources/icons
    to: icons

# Unpack native .node files — they cannot be required() from inside an asar.
asarUnpack:
  - "node_modules/better-sqlite3/**"
  - "node_modules/node-pty/**"

# ── macOS ──────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder
  notarize: true

dmg:
  sign: false

# ── Windows ────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
    # Portable exe-in-zip alongside the installer. The zip holds the runnable
    # AX Code.exe + resources (extract and run, no install). The NSIS
    # installer above remains the auto-update channel (latest.yml).
    - target: zip
  # IMPORTANT: do NOT list `arch:` here. x64 and arm64 build in SEPARATE CI jobs
  # on separate runners (native modules must compile for the target arch), and
  # the arch is selected per job by the electron-builder CLI flag (--x64 /
  # --arm64) passed through package.mjs. Listing both arches here makes every job
  # build BOTH — producing an arm64 installer with x64-compiled native modules
  # (and vice versa) plus a combined non-arch installer that collides between
  # jobs. With no arch here, the CLI flag is the sole source and each job emits
  # exactly its own arch. The ${arch} token keeps the per-arch installer/zip/
  # blockmap names distinct on the shared release.
  icon: build/icon.ico
  # Authenticode via the DEFAI certificate in Azure Key Vault. The custom hook
  # invokes AzureSignTool while electron-builder is packaging, so application
  # binaries and the final NSIS installer are signed before update hashes and
  # blockmaps are generated. Local builds without signing env remain unsigned;
  # release CI sets WINDOWS_SIGNING_REQUIRED=true and fails closed.
  signtoolOptions:
    sign: scripts/sign-windows.cjs
    signingHashAlgorithms: [sha256]
    # electron-builder cannot infer the publisher from a remote signing key.
    # Set it explicitly so electron-updater verifies the expected publisher.
    publisherName: DEFAI Private Limited

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: DeFAI Digital
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

# ── Linux ──────────────────────────────────────────────────────────────────
# Ubuntu Desktop 24.04+ glibc (amd64 + arm64). Same arch rule as Windows: do
# NOT list arch here — CI selects --x64 / --arm64 per runner so native modules
# match the target. AppImage is the portable / auto-update channel
# (latest-linux.yml / latest-linux-arm64.yml); .deb is the Ubuntu install path.
linux:
  target:
    - target: AppImage
    - target: deb
  category: Development
  icon: build/icon.png
  maintainer: DEFAI Private Limited <support@defai.digital>
  vendor: DEFAI Private Limited
  synopsis: Local-first coding agent desktop workspace
  description: AX Code Desktop is the graphical workspace for the AX Code agent runtime.
  # Keep .desktop filename / WM_CLASS aligned with Electron app_id (see package.json desktopName).
  syncDesktopName: true
  desktop:
    entry:
      Name: AX Code
      Comment: Local-first agent runtime for software work
      Categories: Development;IDE;
      StartupWMClass: ax-code-desktop
  # Executable name used by AppImage/.desktop files. Keep stable for updates.
  executableName: ax-code-desktop

deb:
  # Keep the apt package name distinct from the CLI (formula/binary "ax-code").
  packageName: ax-code-desktop
  depends:
    # Electron runtime deps commonly required on Ubuntu Desktop.
    # Keep in sync with electron-builder defaults (includes libsecret for keychain).
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

# ── Auto-update ────────────────────────────────────────────────────────────
publish:
  provider: github
  owner: defai-digital
  repo: ax-code
