appId: ai.defai.ax-code-app
productName: AX Code
copyright: Copyright © 2025-2026 DEFAI Private Limited

# We rebuild native modules manually via rebuild:native before packaging.
npmRebuild: false

directories:
  buildResources: build
  output: dist

# Protect Electron-owned JavaScript with a minimal-unpack ASAR and explicit
# production fuses. Keep runAsNode enabled because the packaged desktop CLI
# uses the Electron binary as a Node-compatible launcher. The separate ax-code
# child runtime remains in extraResources because it is executed by Node 26.
asar:
  # electron-builder's default smart unpack extracts an entire dependency when
  # it finds one native binary. Explicit patterns below keep node-pty's JS in
  # app.asar while leaving only native code and its helper executable outside.
  smartUnpack: false
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

# Include ${os} so mac arm64 zip and win arm64 zip don't collide on the same
# release (both would be AX-Code-1.3.0-arm64.zip without the os token).
artifactName: AX-Code-${version}-${os}-${arch}.${ext}

# Files packaged into app.asar
files:
  - package.json
  - dist/main.js
  - dist/preload.js
  # Forked by main.js via utilityProcess; must be packaged or the server cannot
  # start in a production build.
  - dist/server-process.js
  - dist/server.js
  - dist/desktop-cli.mjs
  # Trusted copy of the staged sidecar manifest. Electron main verifies the
  # external runtime against this ASAR-protected copy before spawning it.
  - dist/ax-code-runtime-manifest.json
  # Renderer JavaScript and static assets are read through Electron's patched
  # fs APIs by the app:// protocol handler and the utility process.
  - from: resources/web-dist
    to: web-dist

# Only resources that require a real filesystem path stay outside app.asar.
extraResources:
  # macOS menu-bar tray icons (template PNGs + status glyphs)
  - from: resources/icons
    to: icons
  # Closed-source AX Computer computer-use server, staged by
  # scripts/stage-ax-computer.sh (placeholder README.txt in OSS/dev builds).
  - from: resources/ax-computer
    to: ax-computer
  # Pinned ax-code CLI runtime, staged by scripts/stage-ax-code.sh
  # (placeholder README.txt in OSS/dev builds). extraResources never enter
  # the asar, so no asarUnpack entry is needed for the runtime tree.
  - from: resources/ax-code
    to: ax-code
  # electron-builder unconditionally filters a node_modules directory at the
  # root of every FileSet. Copy it through a separate FileSet whose root is the
  # directory itself; otherwise release installers contain the CLI launcher
  # but none of its runtime dependencies.
  - from: resources/ax-code/node_modules
    to: ax-code/node_modules

# Fail packaging if a staged CLI tree lost any direct runtime dependency while
# electron-builder copied extraResources. Placeholder OSS/dev builds still pass.
afterPack: scripts/verify-packaged-ax-code.cjs

# Keep native code and node-pty's extensionless Unix helper on real filesystem
# paths. JavaScript wrappers remain in app.asar on every platform.
asarUnpack:
  - "node_modules/**/*.{node,dll,exe,dylib,so}"
  - "node_modules/**/spawn-helper"

# ── macOS ──────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder
    # TCC purpose strings for the bundled computer-use server. It runs as a
    # child of the app, so macOS attributes screen recording / automation
    # prompts to AX Code Desktop (no entitlements needed — not sandboxed).
    NSScreenCaptureUsageDescription: AX Code Desktop uses screen capture to let the agent observe apps when computer-use is enabled.
    NSAppleEventsUsageDescription: AX Code Desktop uses event control to let the agent operate apps when computer-use is enabled.
  notarize: true

dmg:
  sign: false

# ── Windows ────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
    # Portable exe-in-zip alongside the installer. The zip holds the runnable
    # AX Code.exe + resources (extract and run, no install). The NSIS
    # installer above remains the auto-update channel (latest.yml).
    - target: zip
  # IMPORTANT: do NOT list `arch:` here. x64 and arm64 build in SEPARATE CI jobs
  # on separate runners (native modules must compile for the target arch), and
  # the arch is selected per job by the electron-builder CLI flag (--x64 /
  # --arm64) passed through package.mjs. Listing both arches here makes every job
  # build BOTH — producing an arm64 installer with x64-compiled native modules
  # (and vice versa) plus a combined non-arch installer that collides between
  # jobs. With no arch here, the CLI flag is the sole source and each job emits
  # exactly its own arch. The ${arch} token keeps the per-arch installer/zip/
  # blockmap names distinct on the shared release.
  icon: build/icon.ico
  # Authenticode via the DEFAI certificate in Azure Key Vault. The custom hook
  # invokes AzureSignTool while electron-builder is packaging, so application
  # binaries and the final NSIS installer are signed before update hashes and
  # blockmaps are generated. Local builds without signing env remain unsigned;
  # release CI sets WINDOWS_SIGNING_REQUIRED=true and fails closed.
  signtoolOptions:
    sign: scripts/sign-windows.cjs
    signingHashAlgorithms: [sha256]
    # electron-builder cannot infer the publisher from a remote signing key.
    # Set it explicitly so electron-updater verifies the expected publisher.
    publisherName: DEFAI Private Limited
  # Sign native addons as well as the default .exe files. The bundled JS is
  # protected by runtime-manifest.json; PE files must have Authenticode.
  signExts:
    - .dll
    - .node

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: DeFAI Digital
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

# ── Linux ──────────────────────────────────────────────────────────────────
# Ubuntu Desktop 24.04+ glibc (amd64 + arm64). Same arch rule as Windows: do
# NOT list arch here — CI selects --x64 / --arm64 per runner so native modules
# match the target. AppImage is the portable / auto-update channel
# (latest-linux.yml / latest-linux-arm64.yml); .deb is the Ubuntu install path.
linux:
  target:
    - target: AppImage
    - target: deb
  category: Development
  icon: build/icon.png
  maintainer: DEFAI Private Limited <support@defai.digital>
  vendor: DEFAI Private Limited
  synopsis: Local-first coding agent desktop workspace
  description: AX Code Desktop is the graphical workspace for the AX Code agent runtime.
  # Keep .desktop filename / WM_CLASS aligned with Electron app_id (see package.json desktopName).
  syncDesktopName: true
  desktop:
    entry:
      Name: AX Code
      Comment: Local-first agent runtime for software work
      Categories: Development;IDE;
      StartupWMClass: ax-code-desktop
  # Executable name used by AppImage/.desktop files. Keep stable for updates.
  executableName: ax-code-desktop

deb:
  # Keep the apt package name distinct from the CLI (formula/binary "ax-code").
  packageName: ax-code-desktop
  depends:
    # Electron runtime deps commonly required on Ubuntu Desktop.
    # Keep in sync with electron-builder defaults (includes libsecret for keychain).
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

# ── Auto-update ────────────────────────────────────────────────────────────
publish:
  provider: github
  owner: defai-digital
  repo: ax-code
